spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:chainflow_redis}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:18848}
        enabled: ${NACOS_ENABLED:false}
        register-enabled: ${NACOS_ENABLED:false}
chainflow:
  security:
    jwt-secret: ${JWT_SECRET:change-this-chainflow-secret-key-please-32chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  demo:
    username: ${CHAINFLOW_DEMO_USERNAME:admin}
    password: ${CHAINFLOW_DEMO_PASSWORD:admin123}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
server:
  port: 9001
logging:
  pattern:
    level: '%5p [traceId=%X{X-Trace-Id:-}]'

