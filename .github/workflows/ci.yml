name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      # Validate both Compose files without pulling images or starting services.
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml config --quiet
